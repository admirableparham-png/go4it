<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>go4it — sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="min-h-full flex items-center justify-center px-6">
    <div class="w-full max-w-sm">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold tracking-tight">go4it</h1>
        <p class="text-slate-400 text-sm">sign in to continue</p>
      </div>
      <form method="post" action="/login" class="space-y-3 rounded-xl border border-slate-800 bg-slate-900 p-6">
        {% if error %}
          <div class="text-sm text-rose-300 bg-rose-900/20 border border-rose-800/50 rounded px-3 py-2">
            Invalid email or password.
          </div>
        {% endif %}
        <input name="email" type="email" required placeholder="Email"
               class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-slate-500">
        <input name="password" type="password" required placeholder="Password"
               class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-slate-500">
        <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white rounded py-2 text-sm font-medium">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
